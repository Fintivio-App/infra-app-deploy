###############################################################################
# Fintivio — single-VM demo stack (fintivio.rosfin.tech)
#
# Routing model:
#   - All public traffic terminates at the `nginx` service (TLS, ports 80/443).
#   - The gateway forwards API calls to  http://fintivio-<svc>-api.application/...
#     (no port -> 80). We DON'T change the backends: instead `nginx` also carries
#     every `fintivio-*-api.application` network alias and proxies Host -> svc:8080,
#     exactly mirroring what the Kubernetes Service did (port 80 -> targetPort 8080).
#   - Backend images are pulled from Docker Hub as-is; frontends are built locally
#     (scripts/03-build-frontends.sh) from their demo-version branch and tagged :demo.
#
# Bring-up order is handled by scripts/05-up.sh (infra -> migrations -> apps).
###############################################################################

x-node-backend: &node-backend
  env_file: [.env]
  restart: unless-stopped
  networks: [fintivio]
  mem_limit: 512m
  depends_on:
    postgres: {condition: service_healthy}
    redis:    {condition: service_started}

x-java-backend: &java-backend
  env_file: [.env]
  restart: unless-stopped
  networks: [fintivio]
  # Spring reads SERVER_PORT/SPRING_DATASOURCE_* from .env. Stays on 8080 (approach B).
  # MaxRAMPercentage=75% of THIS limit -> ~1.1 GB heap (not 75% of the 36 GB host).
  mem_limit: 1536m
  environment:
    # Node images need AZURE_KEYVAULT_URL non-empty (boot hydration throws on empty, then
    # skips every key since all are set in .env). Java's Spring KV starter would try to
    # CONNECT to a non-empty URL, so force it back to empty here -> Java skips KV gracefully.
    AZURE_KEYVAULT_URL: ""
  depends_on:
    postgres: {condition: service_healthy}

x-ui: &ui
  restart: unless-stopped
  networks: [fintivio]
  mem_limit: 64m
  expose: ["80"]

services:
  # ─────────────────────────── Infrastructure ────────────────────────────────
  postgres:
    image: postgres:15
    container_name: fintivio-postgres
    mem_limit: 4g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    # SSL enabled: the gateway/document/notifications Node images hardcode ssl:true
    # (rejectUnauthorized:false), so Postgres must offer SSL. Self-signed cert in ./pgcerts
    # (key owned by uid 999 = the postgres user). Non-SSL services still connect fine.
    command: ["postgres","-c","max_connections=512","-c","ssl=on","-c","ssl_cert_file=/pgcerts/server.crt","-c","ssl_key_file=/pgcerts/server.key"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs ONCE on an empty data dir: creates schemas (main/sandbox/real_estate) + keycloak DB.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./pgcerts:/pgcerts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fintivio]
    restart: unless-stopped

  redis:
    image: redis:8.4
    container_name: fintivio-redis
    mem_limit: 512m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    networks: [fintivio]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fintivio-minio
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [minio_data:/data]
    networks: [fintivio]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: fintivio-keycloak
    mem_limit: 1g
    # --import-realm loads /opt/keycloak/data/import/*.json on first boot.
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      # Keycloak 26 syntax (v1 hostname-url/proxy options are deprecated and emit http issuer).
      KC_PROXY_HEADERS: xforwarded         # trust nginx X-Forwarded-Proto=https
      KC_HOSTNAME: "https://auth.${DOMAIN}"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [fintivio]
    restart: unless-stopped

  # ─────────────────────────── Reverse proxy ─────────────────────────────────
  # Public TLS vhosts + internal `.application` resolution (Host -> svc:8080).
  nginx:
    image: nginx:alpine
    container_name: nginx-shared
    mem_limit: 256m
    ports: ["80:80", "443:443"]
    environment:
      # Only DOMAIN is in the container env, so the official image's envsubst step
      # substitutes ${DOMAIN} in *.template but leaves nginx vars ($host/$uri/...) intact.
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      fintivio:
        aliases:
          # The gateway (and some inter-service defaults) call these hostnames on port 80.
          - fintivio-user-management-api.application
          - fintivio-dashboard-api.application
          - fintivio-asset-management-api.application
          - fintivio-entity-management-api.application
          - fintivio-family-management-api.application
          - fintivio-lifestyle-assets-api.application
          - fintivio-private-investments-api.application
          - fintivio-calendar-api.application
          - fintivio-real-estate-api.application
          - fintivio-accounts-api.application
          - fintivio-public-markets-api.application
          - fintivio-reports-api.application
          - fintivio-brokerage-sync-api.application
          - fintivio-provider-management-api.application
          - fintivio-report-parser-api.application
          - fintivio-document-api.application
          - fintivio-notifications-api.application
          - fintivio-ai-orchestrator.application
    depends_on: [fintivio-gateway, fintivio-main-ui]
    restart: unless-stopped

  # ─────────────────────────── Node backends ─────────────────────────────────
  fintivio-gateway:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-gateway:RELEASE-176
    container_name: fintivio-gateway
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_started}
      keycloak: {condition: service_started}

  fintivio-user-management-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-user-management-api:SNAPSHOT-demo-version-129
    container_name: fintivio-user-management-api

  fintivio-dashboard-api:
    <<: *node-backend
    environment:
      PUBLIC_MARKETS_API_HOST: fintivio-public-markets-api
      REAL_ESTATE_API_HOST: fintivio-real-estate-api
      LIFESTYLE_ASSETS_API_HOST: fintivio-lifestyle-assets-api
      ACCOUNTS_API_HOST: fintivio-accounts-api
      PRIVATE_INVESTMENTS_API_HOST: fintivio-private-investments-api
    image: admacc1/fintivio-dashboard-api:SNAPSHOT-feat.ai-95
    container_name: fintivio-dashboard-api

  fintivio-asset-management-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-asset-management-api:SNAPSHOT-fix-pre-client-audit-114
    container_name: fintivio-asset-management-api

  fintivio-entity-management-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-entity-management-api:SNAPSHOT-fix.pre-client-audit-39
    container_name: fintivio-entity-management-api

  fintivio-family-management-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-family-management-api:SNAPSHOT-fix.pre-client-audit-56
    container_name: fintivio-family-management-api

  fintivio-lifestyle-assets-api:
    <<: *node-backend
    image: admacc1/fintivio-lifestyle-assets-api:SNAPSHOT-fix.pre-client-audit-50
    container_name: fintivio-lifestyle-assets-api
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  fintivio-private-investments-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-private-investments-api:SNAPSHOT-fix.pre-client-audit-124
    container_name: fintivio-private-investments-api

  fintivio-calendar-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-calendar-api:SNAPSHOT-fix.pre-client-audit-56
    container_name: fintivio-calendar-api

  fintivio-real-estate-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-real-estate-api:SNAPSHOT-fix.pre-client-audit-28
    container_name: fintivio-real-estate-api
    environment:
      DATABASE_SCHEMA: real_estate   # real-estate-api uses its own schema
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  fintivio-financial-job:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-financial-job:SNAPSHOT-feat.snapshots-45
    container_name: fintivio-financial-job
    # cron worker, no inbound port

  # ─────────────────────────── Java backends ─────────────────────────────────
  fintivio-accounts-api:
    <<: *java-backend
    image: admacc1/fintivio-accounts-api:SNAPSHOT-fix.pre-client-audit-132
    container_name: fintivio-accounts-api

  fintivio-holding-snapshot-job-api:
    <<: *java-backend
    image: admacc1/fintivio-holding-snapshot-job-api:SNAPSHOT-fix.pre-client-audit-22
    container_name: fintivio-holding-snapshot-job-api
    environment:
      AZURE_KEYVAULT_URL: ""
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

  fintivio-public-markets-api:
    <<: *java-backend
    image: admacc1/fintivio-public-markets-api:SNAPSHOT-fix.pre-client-audit-65
    container_name: fintivio-public-markets-api

  fintivio-reports-api:
    <<: *java-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-reports-api:SNAPSHOT-fix.pre-client-audit-48
    container_name: fintivio-reports-api
    environment:
      AZURE_KEYVAULT_URL: ""
      MINIO_URL: "http://fintivio-document-api:8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

  fintivio-brokerage-sync-api:
    <<: *java-backend
    image: admacc1/fintivio-brokerage-sync-api:SNAPSHOT-fix.pre-client-audit-25
    container_name: fintivio-brokerage-sync-api

  fintivio-provider-management-api:
    <<: *java-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-provider-management-api:SNAPSHOT-demo-version-41
    container_name: fintivio-provider-management-api

  fintivio-report-parser-api:
    <<: *java-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-report-parser-api:latest
    container_name: fintivio-report-parser-api

  fintivio-document-api:
    <<: *node-backend
    image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-document-api:RELEASE-66
    container_name: fintivio-document-api
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      MINIO_EXTERNAL_HOST: "files.fintivio.rosfin.tech"

  # ── Optional dependencies (referenced by some services; enable if images exist) ──
  # DISABLED (optional): document-api needs a specific MinIO endpoint config;
  # notifications-api hard-requires real email creds. Enable once those are provided.
  # fintivio-document-api:
  #   <<: *node-backend
  #   image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-document-api:RELEASE-66
  #   container_name: fintivio-document-api
  # fintivio-notifications-api:
  #   <<: *node-backend
  #   image: ${BACKEND_IMAGE_NAMESPACE}/fintivio-notifications-api:RELEASE-20
  #   container_name: fintivio-notifications-api

  # ─────────────────────────── Frontends ─────────────────────────────────────
  fintivio-main-ui:
    <<: *ui
    image: admacc1/fintivio-main-ui:SNAPSHOT-demo-version-195
    container_name: fintivio-main-ui

  fintivio-dashboard-ui:
    <<: *ui
    image: admacc1/fintivio-dashboard-ui:SNAPSHOT-demo-version-52
    container_name: fintivio-dashboard-ui
  fintivio-reports-ui:
    <<: *ui
    image: admacc1/fintivio-reports-ui:SNAPSHOT-demo-version-48
    container_name: fintivio-reports-ui
  fintivio-calendar-ui:
    <<: *ui
    image: admacc1/fintivio-calendar-ui:SNAPSHOT-demo-version-48
    container_name: fintivio-calendar-ui
  fintivio-accounts-ui:
    <<: *ui
    image: admacc1/fintivio-accounts-ui:SNAPSHOT-demo-version-122
    container_name: fintivio-accounts-ui
  fintivio-public-markets-ui:
    <<: *ui
    image: admacc1/fintivio-public-markets-ui:SNAPSHOT-demo-version-76
    container_name: fintivio-public-markets-ui
  fintivio-private-investments-ui:
    <<: *ui
    image: admacc1/fintivio-private-investments-ui:SNAPSHOT-demo-version-89
    container_name: fintivio-private-investments-ui
  fintivio-lifestyle-assets-ui:
    <<: *ui
    image: admacc1/fintivio-lifestyle-assets-ui:SNAPSHOT-demo-version-106
    container_name: fintivio-lifestyle-assets-ui
  fintivio-provider-management-ui:
    <<: *ui
    image: admacc1/fintivio-provider-management-ui:SNAPSHOT-demo-version-126
    container_name: fintivio-provider-management-ui
  fintivio-user-management-ui:
    <<: *ui
    image: admacc1/fintivio-user-management-ui:SNAPSHOT-demo-version-73
    container_name: fintivio-user-management-ui
  fintivio-entity-management-ui:
    <<: *ui
    image: admacc1/fintivio-entity-management-ui:SNAPSHOT-demo-version-104
    container_name: fintivio-entity-management-ui
  fintivio-family-management-ui:
    <<: *ui
    image: admacc1/fintivio-family-management-ui:SNAPSHOT-demo-version-134
    container_name: fintivio-family-management-ui
  fintivio-real-estate-ui:
    <<: *ui
    image: admacc1/fintivio-real-estate-ui:SNAPSHOT-demo-version-39
    container_name: fintivio-real-estate-ui

networks:
  fintivio:
    name: fintivio-demo-net
    driver: bridge

volumes:
  postgres_data: {name: fintivio-demo-postgres}
  redis_data:    {name: fintivio-demo-redis}
  minio_data:    {name: fintivio-demo-minio}
  keycloak_data: {name: fintivio-demo-keycloak}
